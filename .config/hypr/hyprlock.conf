# ~/.config/hypr/hyprlock.conf

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 450, 60
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.8
    outer_color = rgb(151515)
    inner_color = rgba(200, 200, 200, 0)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
    hide_input = false
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 128
    font_family = sans-serif
    position = 0, 160
    halign = center
    valign = center
}
