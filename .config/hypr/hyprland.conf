# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_options = lv3:ralt_switch
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, librewolf
bind = $mainMod, C, killactive
bind = $mainMod, P, exec, passmenu
bindl = , Print, exec, ~/.custom/screenshot.sh
bind = $mainMod SHIFT, P, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
#bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod CTRL, L, exec, hyprlock
bind = $mainMod, Tab, exec, rofi -show window
bind = $mainMod, O, exec, rofi -show ssh

bind = $mainMod, Backspace, layoutmsg, togglesplit, # dwindle
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod, N, fullscreen, 0


bind = $mainMod $mainMod2, P, exit,

# i3: $mod+y focus parent
bind = $mainMod, Y, focuswindow, parent
# i3: $mod+u focus child
bind = $mainMod, U, focuswindow, child # best-effort: focus child

# --- Move workspace to output ---
# i3: $mod+Shift+h/j/k/l move workspace to output left/down/up/right
bind = $mainMod SHIFT, H, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT, J, movecurrentworkspacetomonitor, d
bind = $mainMod SHIFT, K, movecurrentworkspacetomonitor, u
bind = $mainMod SHIFT, L, movecurrentworkspacetomonitor, r

# --- Change focus (vim keys) ---
# i3: $mod+h/j/k/l focus left/down/up/right
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# --- Move focused window ---
# i3: $mod+$key1+h/j/k/l move left/down/up/right
bind = $mainMod $mainMod2, H, movewindow, l
bind = $mainMod $mainMod2, J, movewindow, d
bind = $mainMod $mainMod2, K, movewindow, u
bind = $mainMod $mainMod2, L, movewindow, r

# --- Switch to workspace ---
# i3: $mod+1-5 workspace 1-5, $mod+q/w/e/r/t workspace 6-10, $mod+6/7/8/9/0 workspace 11-15
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, Q, workspace, 6
bind = $mainMod, W, workspace, 7
bind = $mainMod, E, workspace, 8
bind = $mainMod, R, workspace, 9
bind = $mainMod, T, workspace, 10
bind = $mainMod, 6, workspace, 11
bind = $mainMod, 7, workspace, 12
bind = $mainMod, 8, workspace, 13
bind = $mainMod, 9, workspace, 14
bind = $mainMod, 0, workspace, 15

# --- Move focused container to workspace ---
# i3: $mod+$key1+1-5 / q / w / e / r / t / 6-0 move container to workspace 1-15
bind = $mainMod $mainMod2, 1, movetoworkspace, 1
bind = $mainMod $mainMod2, 2, movetoworkspace, 2
bind = $mainMod $mainMod2, 3, movetoworkspace, 3
bind = $mainMod $mainMod2, 4, movetoworkspace, 4
bind = $mainMod $mainMod2, 5, movetoworkspace, 5
bind = $mainMod $mainMod2, Q, movetoworkspace, 6
bind = $mainMod $mainMod2, W, movetoworkspace, 7
bind = $mainMod $mainMod2, E, movetoworkspace, 8
bind = $mainMod $mainMod2, R, movetoworkspace, 9
bind = $mainMod $mainMod2, T, movetoworkspace, 10
bind = $mainMod $mainMod2, 6, movetoworkspace, 11
bind = $mainMod $mainMod2, 7, movetoworkspace, 12
bind = $mainMod $mainMod2, 8, movetoworkspace, 13
bind = $mainMod $mainMod2, 9, movetoworkspace, 14
bind = $mainMod $mainMod2, 0, movetoworkspace, 15

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous



bind = $mainMod, I, submap, resize
submap = resize
# h/l shrink/grow width, j/k grow/shrink height (i3 semantics)
bind = , H, resizeactive, -5 0
bind = , L, resizeactive, 5 0
bind = , J, resizeactive, 0 5
bind = , K, resizeactive, 0 -5
# arrow keys
bind = , left, resizeactive, -5 0
bind = , right, resizeactive, 5 0
bind = , down, resizeactive, 0 5
bind = , up, resizeactive, 0 -5
# back to normal: Enter or Escape
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
